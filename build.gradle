plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "com.hypherionmc.modutils.modpublisher" version "2.1.8"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fabric_tps" {
			sourceSet sourceSets.main
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "loader_version", project.loader_version
	inputs.property "fabric_version", project.fabric_version

	filesMatching("fabric.mod.json") {
		expand([
				"version": project.version,
				"loader_version": project.loader_version,
				"fabric_version": project.fabric_version,
		])
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

publisher {
	apiKeys {
		modrinth System.getenv("MODRINTH_TOKEN")
		curseforge System.getenv("CURSE_TOKEN")
		github System.getenv("GITHUB_TOKEN")
	}

	setCurseID("918784")
	setModrinthID("X30askCw")

	setVersionType("release")

	setChangelog(new File("${project.rootDir}/changelog.md").text)

	setProjectVersion(project.semantic_version)

	setDisplayName("Fabric TPS ${project.semantic_version}")

	setGameVersions("26.1", "26.1.1", "26.1.2", "26.2", "26.3")

	setLoaders("fabric", "quilt")

	setCurseEnvironment("server")

	setIsManualRelease(false)

	setArtifact("${project.rootDir}/build/libs/${project.archives_base_name}-${project.mod_version}.jar")

	setDisableMalwareScanner(true)

	setJavaVersions(JavaVersion.VERSION_25, 25)

	setDisableEmptyJarCheck(true)

	github {
		repo = "Pyrix25633/Fabric-FabricTPS"
		tag = "${project.semantic_version}"
		displayName = "Fabric TPS ${project.mod_version}"
		createTag = true
		createRelease = true
		updateRelease = true
		draft = false
		target = "main"
	}

	modrinthDepends {
		optional 'fabric-api', 'qsl'
	}

	curseDepends {
		optional 'fabric-api', 'qsl'
	}
}
